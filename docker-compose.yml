services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orchestrator
      POSTGRES_PASSWORD: orchestrator
      POSTGRES_DB: orchestrator
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orchestrator"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  jaeger:
    image: jaegertracing/all-in-one:1.57
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP

  api:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./:/app
      - ./data:/app/data
    command: >
      bash -c "pip install --no-cache-dir -r requirements.txt &&
      uvicorn orchestrator.main:app --host 0.0.0.0 --port 8000 --app-dir src"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://orchestrator:orchestrator@postgres:5432/orchestrator
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OLLAMA_HOST: http://host.docker.internal:11434
      PYTHONPATH: /app/src
      FRONTEND_PUBLIC_URL: http://localhost:5173
      ORCHESTRATOR_PUBLIC_URL: http://localhost:8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"

  worker:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./:/app
      - ./data:/app/data
    command: >
      bash -c "pip install --no-cache-dir -r requirements.txt &&
      celery -A orchestrator.worker.celery_app worker --loglevel=INFO --concurrency=2"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://orchestrator:orchestrator@postgres:5432/orchestrator
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OLLAMA_HOST: http://host.docker.internal:11434
      PYTHONPATH: /app/src
      FRONTEND_PUBLIC_URL: http://localhost:5173
      ORCHESTRATOR_PUBLIC_URL: http://localhost:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ui:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./web:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      VITE_API_BASE: http://localhost:8000
    ports:
      - "5174:5173"
    depends_on:
      - api

volumes:
  pgdata:
